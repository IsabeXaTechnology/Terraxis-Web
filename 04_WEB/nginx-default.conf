# TERRAXIS · config nginx del contenedor
# EasyPanel/Traefik termina el SSL y reenvía HTTP al puerto 80 con el Host original.

# Redirección canónica: www -> dominio pelón (301 permanente)
server {
    listen 80;
    server_name www.terraxiselectoral.com;
    return 301 https://terraxiselectoral.com$request_uri;
}

# Sitio principal: apex, URL temporal de EasyPanel y cualquier otro host
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
